[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enhanced-budget-pro"
version = "0.1.0"
description = "Enhanced Budget Pro - Film Production Budgeting System"
readme = "README.md"
authors = [
    {name = "FilmStudioDev Team", email = "dev@filmstudiodev.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Entertainment Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.17.0",
    "pdfplumber>=0.10.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "reportlab>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
integration = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "icalendar>=5.0.0",
    "slack-sdk>=3.21.0",
    "monday>=1.2.0",
]
ml = [
    "scikit-learn>=1.3.0",
    "spacy>=3.6.0",
    "nltk>=3.8.0",
    "prophet>=1.1.0",
]
full = [
    "enhanced-budget-pro[dev]",
    "enhanced-budget-pro[integration]",
    "enhanced-budget-pro[ml]",
]

[project.urls]
Homepage = "https://github.com/filmstudiodev/enhanced-budget-pro"
Documentation = "https://enhanced-budget-pro.readthedocs.io"
Repository = "https://github.com/filmstudiodev/enhanced-budget-pro.git"
Issues = "https://github.com/filmstudiodev/enhanced-budget-pro/issues"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests",
    "unit: unit tests",
]