version: '3.8'

services:
  # Streamlit UI Service
  streamlit:
    build: .
    container_name: pilotforge-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./output:/app/output
      - ./samples:/app/samples:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    command: streamlit run ui_app.py --server.address 0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Flask Web App Service
  web:
    build: .
    container_name: pilotforge-web
    ports:
      - "5000:5000"
    volumes:
      - ./web_output:/app/web_output
      - ./samples:/app/samples:ro
    environment:
      - FLASK_APP=web_app.py
      - FLASK_ENV=production
    command: python web_app.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  output:
  web_output:

networks:
  default:
    name: pilotforge-network
