name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  # Job 1: Code Quality & Linting
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install black flake8 pylint
          pip install -r requirements.txt
      
      - name: Run Black formatter check
        run: black --check src/ tests/
        continue-on-error: true
      
      - name: Run Flake8 linter
        run: flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503
        continue-on-error: true

  # Job 2: Unit & Integration Tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist
      
      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=src/VisualizationEngine --cov-report=xml
      
      - name: Run integration tests
        run: pytest tests/integration/ -v
        continue-on-error: true
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  # Job 3: Build & Test Docker Image
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build -t pilotforgeai:test .
      
      - name: Test Docker image
        run: |
          docker run --rm -d --name test-container -p 8501:8501 pilotforgeai:test
          sleep 10
          curl -f http://localhost:8501/_stcore/health || exit 1
          docker stop test-container
      
      - name: Log in to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push to Docker Hub
        if: github.event_name == 'release'
        run: |
          docker tag pilotforgeai:test ${{ secrets.DOCKER_USERNAME }}/pilotforgeai:latest
          docker tag pilotforgeai:test ${{ secrets.DOCKER_USERNAME }}/pilotforgeai:${{ github.event.release.tag_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/pilotforgeai:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/pilotforgeai:${{ github.event.release.tag_name }}

  # Job 4: Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # Job 5: Deploy to Production (on release)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'release'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy notification
        run: |
          echo "🚀 Deploying version ${{ github.event.release.tag_name }}"
          echo "Docker image: pilotforgeai:${{ github.event.release.tag_name }}"
      
      # Add your deployment steps here (AWS, Azure, GCP, etc.)
      # Example: Deploy to AWS ECS, Azure Container Instances, etc.
